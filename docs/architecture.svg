<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" width="1300" height="620" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Architecture: one patient, every branch</title>
<desc id="d">A browser opens the console on dash-server, which queries Exasol as a read-only user; an AI agent (exasol-mcp-server) queries Exasol as a named user. Inside the Exasol Personal VM, Exasol reads the legacy HIS on Postgres 16 through a JDBC virtual schema and the modern EHR on MongoDB 8.2 through a Rust-adapter virtual schema. Exasol imports the DICOM header index from Amazon S3 in place; the console fetches image bytes from S3 with a signed link.</desc>
